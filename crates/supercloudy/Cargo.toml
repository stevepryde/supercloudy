[package]
name = "supercloudy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory cloud service emulators, starting with DynamoDB"

[dependencies]
base64.workspace = true
bigdecimal.workspace = true
serde.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
md-5 = "0.10"
sha2 = "0.10"
crc32fast = "1"
quick-xml = "0.41"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
httpdate = "1"
http-body-util = "0.1"
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
jsonwebtoken = { version = "10.4", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Keep the current HTTPS client without the legacy HTTP/TLS stack enabled by defaults.
aws-sdk-dynamodb = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-ring"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
tokio = { workspace = true, features = ["io-util", "process", "time"] }
