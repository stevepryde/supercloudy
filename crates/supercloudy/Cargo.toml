[package]
name = "supercloudy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory cloud service emulators, starting with DynamoDB"

[dependencies]
base64.workspace = true
bigdecimal.workspace = true
serde.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
md-5 = "0.10"
sha2 = "0.10"
crc32fast = "1"
quick-xml = "0.38"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
httpdate = "1"
http-body-util = "0.1"
percent-encoding = "2"
rsa = "0.9"
rcgen = "0.14"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
aws-sdk-dynamodb = "1.135.0"
aws-sdk-ssm = "1.121.0"
aws-sdk-s3 = "1.144.0"
aws-sdk-lambda = "1"
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-ring"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
tokio = { workspace = true, features = ["io-util", "process", "time"] }
